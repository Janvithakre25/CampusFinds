{% extends 'base.html' %}
{% block title %}500 - Server Error — CampusFind{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-danger">500</h1>
        <h3 class="fw-bold mb-3">Internal Server Error</h3>
        <p class="text-muted mb-4">Something went wrong on our end while processing your request. Please try again shortly.</p>
        <a href="{{ url_for('dashboard.home') }}" class="btn btn-primary px-4 fw-semibold">
            <i class="bi bi-house-door me-1"></i> Return to CampusFind Home
        </a>
    </div>
</div>
{% endblock %}
