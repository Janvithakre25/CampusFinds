{% extends 'base.html' %}
{% block title %}Register — CampusFind{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 p-4">
                <div class="text-center mb-4">
                    <span class="badge bg-success fs-3 p-3 rounded-circle mb-3"><i class="bi bi-person-plus"></i></span>
                    <h3 class="fw-bold">Create Student Account</h3>
                    <p class="text-muted small">Join our campus community to report and claim lost belongings</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Full Name *</label>
                            <input type="text" name="full_name" class="form-control" placeholder="Janvi Thakre" value="{{ full_name or '' }}" required>
                        </div>

                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Campus Email *</label>
                            <input type="email" name="email" class="form-control" placeholder="student@campusfinds.edu" value="{{ email or '' }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Student ID / Roll No</label>
                            <input type="text" name="student_id" class="form-control" placeholder="STU-2026" value="{{ student_id or '' }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <input type="tel" name="phone" class="form-control" placeholder="+1-555-0199" value="{{ phone or '' }}">
                        </div>

                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Department / Faculty</label>
                            <input type="text" name="department" class="form-control" placeholder="Computer Science & Engineering" value="{{ department or '' }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Password *</label>
                            <input type="password" name="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Confirm Password *</label>
                            <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" minlength="6" required>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fw-semibold">
                            <i class="bi bi-check-lg me-1"></i> Register Account
                        </button>
                    </div>
                </form>

                <div class="mt-4 pt-3 border-top text-center small text-muted">
                    Already have an account? <a href="{{ url_for('auth.login') }}" class="fw-semibold text-primary">Log in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
